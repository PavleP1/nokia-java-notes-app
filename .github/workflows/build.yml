name: Build Nokia J2ME Jar

on: [push]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'

      - name: Download J2ME Libraries
        run: |
          wget -q https://github.com/shu223/microedition-libs/raw/master/cldcapi11.jar
          wget -q https://github.com/shu223/microedition-libs/raw/master/midpapi21.jar

      - name: Compile and Package JAR
        run: |
          # Compile targeting Java 1.4 bytecode compatible with Nokia S40
          javac -source 1.4 -target 1.4 -bootclasspath cldcapi11.jar:midpapi21.jar ModernNotes.java

          # Create Manifest file
          echo "Manifest-Version: 1.0" > MANIFEST.MF
          echo "MIDlet-1: Modern Notes, , ModernNotes" >> MANIFEST.MF
          echo "MIDlet-Name: Modern Notes" >> MANIFEST.MF
          echo "MIDlet-Vendor: Custom" >> MANIFEST.MF
          echo "MIDlet-Version: 1.0.0" >> MANIFEST.MF
          echo "MicroEdition-Configuration: CLDC-1.1" >> MANIFEST.MF
          echo "MicroEdition-Profile: MIDP-2.1" >> MANIFEST.MF

          # Pack into JAR archive
          jar cvfm ModernNotes.jar MANIFEST.MF *.class

      - name: Save JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ModernNotes-jar
          path: ModernNotes.jar
          
